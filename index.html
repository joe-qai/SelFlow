<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>SelFlow | 无代码自动化测试框架</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;overflow-x:hidden}
        ::selection{background:#6366f1;color:#fff}
        .navbar{position:fixed;top:0;left:0;right:0;z-index:999;padding:16px 24px;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.05)}.navbar .logo{display:flex;align-items:center;gap:10px}.navbar .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#6366f1 0%,#ec4899 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 20px rgba(99,102,241,0.4)}.navbar .logo-text{font-size:20px;font-weight:700;color:#fff}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0 24px;position:relative;padding-top:80px}
        .container{max-width:900px;width:100%;text-align:center}
        .hero{background:radial-gradient(ellipse at 20% 10%,rgba(99,102,241,0.25) 0%,transparent 40%),radial-gradient(ellipse at 80% 90%,rgba(236,72,153,0.25) 0%,transparent 40%),radial-gradient(ellipse at 50% 50%,rgba(16,185,129,0.1) 0%,transparent 60%),#000}
        .hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(99,102,241,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.03) 1px,transparent 1px);background-size:50px 50px}
        .logo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:40px;animation:fadeInUp 0.8s ease-out}
        .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#6366f1 0%,#ec4899 50%,#10b981 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#fff;box-shadow:0 0 40px rgba(99,102,241,0.5),0 10px 40px rgba(0,0,0,0.5);animation:pulse 2s ease-in-out infinite}
        .logo-text{font-size:32px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero h1{font-size:clamp(56px,16vw,120px);font-weight:900;letter-spacing:-0.06em;line-height:0.95;margin-bottom:28px;background:linear-gradient(135deg,#fff 0%,#a5b4fc 30%,#ec4899 60%,#10b981 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fadeInUp 0.8s ease-out 0.2s both;text-shadow:0 0 100px rgba(99,102,241,0.3)}
        .hero p{font-size:clamp(16px,3vw,24px);color:#9ca3af;line-height:1.6;max-width:700px;margin:0 auto;animation:fadeInUp 0.8s ease-out 0.4s both}
        .hero-btns{display:flex;gap:20px;justify-content:center;margin-top:50px;flex-wrap:wrap;animation:fadeInUp 0.8s ease-out 0.6s both}
        .btn{display:inline-flex;align-items:center;gap:10px;padding:18px 36px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;transition:all 0.3s;min-width:160px;justify-content:center}
        .btn-primary{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;box-shadow:0 10px 40px rgba(99,102,241,0.4);position:relative;overflow:hidden}
        .btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:0.5s}
        .btn-primary:hover::before{left:100%}
        .btn-primary:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 15px 50px rgba(99,102,241,0.5)}
        .btn-secondary{border:2px solid rgba(255,255,255,0.2);color:#fff;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px)}
        .btn-secondary:hover{border-color:#6366f1;color:#fff;background:rgba(99,102,241,0.1);transform:translateY(-4px)}
        .features{background:#0a0a0f;position:relative}
        .features::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#6366f1,transparent)}
        .features h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.2em;color:#6366f1;margin-bottom:20px;animation:fadeInUp 0.8s ease-out}
        .features h3{font-size:clamp(36px,8vw,56px);font-weight:800;letter-spacing:-0.03em;margin-bottom:56px;animation:fadeInUp 0.8s ease-out 0.1s both}
        .feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
        .feature-item{padding:32px 28px;background:linear-gradient(145deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.08);border-radius:20px;transition:all 0.3s;position:relative;overflow:hidden}
        .feature-item::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#6366f1,#ec4899);transform:scaleX(0);transition:0.3s}
        .feature-item:hover::before{transform:scaleX(1)}
        .feature-item:hover{transform:translateY(-6px);border-color:#6366f1;box-shadow:0 12px 48px rgba(99,102,241,0.18)}
        .feature-item h4{font-size:20px;font-weight:700;margin-bottom:10px;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .feature-item p{font-size:14px;color:#9ca3af;line-height:1.6}

        footer{padding:40px 24px;text-align:center;border-top:1px solid rgba(255,255,255,0.05)}
        footer p{font-size:14px;color:#6b7280}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(99,102,241,0.5),0 10px 40px rgba(0,0,0,0.5)}50%{box-shadow:0 0 60px rgba(99,102,241,0.7),0 10px 40px rgba(0,0,0,0.5)}}
        @media (max-width:768px){.hero-btns{flex-direction:column;align-items:center;width:100%}.btn{width:100%;max-width:320px}.feature-grid{grid-template-columns:1fr}.feature-item{padding:28px 24px}}
        @media (max-width:480px){.logo-icon{width:52px;height:52px;font-size:22px}.logo-text{font-size:26px}.hero h1{letter-spacing:-0.04em}.btn{padding:16px 28px;font-size:16px}.feature-item{padding:24px 20px}}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><div class="logo-icon">SF</div><span class="logo-text">SelFlow</span></div>
    </nav>
    <section class="screen hero">
        <div class="container">
            <h1>SelFlow</h1>
            <p>基于 Python + Selenium 的关键字驱动自动化测试框架，通过 Excel 编写测试用例，实现无代码自动化。</p>
            <div class="hero-btns">
                <a href="https://github.com/joe-qai/SelFlow" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    GitHub
                </a>
                <a href="#features" class="btn btn-secondary">了解更多</a>
            </div>
        </div>
    </section>
    <section id="features" class="screen features">
        <div class="container">
            <h2>核心特性</h2>
            <h3>简洁·强大·灵活</h3>
            <div class="feature-grid">
                <div class="feature-item"><h4>Excel 驱动</h4><p>通过 Excel 表格编写测试用例，无需编程基础</p></div>
                <div class="feature-item"><h4>反射机制</h4><p>Python 反射动态调用关键字，扩展性强</p></div>
                <div class="feature-item"><h4>丰富报告</h4><p>自动生成 HTML 测试报告，包含截图和日志</p></div>
                <div class="feature-item"><h4>多框架支持</h4><p>支持 unittest 和 pytest 两种测试框架</p></div>
            </div>
        </div>
    </section>
    <footer><p>SelFlow · 关键字驱动自动化测试框架</p></footer>
</body>
</html>
